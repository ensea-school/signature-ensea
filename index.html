<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature ENSEA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --brand: #A6004C;
  --brand2: #7D0039;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --border: #e0e0e0;
  --text: #1a1a1a;
  --text2: #555555;
  --text3: #888888;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1e1e20;
    --border: #333336;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #666666;
  }
}
:root[data-theme="dark"] {
  --bg: #111113;
  --surface: #1e1e20;
  --border: #333336;
  --text: #f0f0f0;
  --text2: #aaaaaa;
  --text3: #666666;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; }

.hdr {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.hdr-dot {
  width: 10px; height: 10px;
  background: var(--brand);
  border-radius: 50%;
  flex-shrink: 0;
}
.hdr-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: -0.01em;
}
.hdr-sub {
  font-size: 12px;
  color: var(--text3);
  margin-left: auto;
}

.layout {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: calc(100vh - 53px);
}

.pane {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
}
.pane h2 {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin: 20px 0 10px;
}
.pane h2:first-child { margin-top: 0; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }
.field input, .field select {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--brand); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.toggle-row label { font-size: 13px; color: var(--text); cursor: pointer; user-select: none; }
.toggle-row input[type=checkbox] {
  width: 16px; height: 16px;
  accent-color: var(--brand);
  cursor: pointer;
}

.preview {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.preview-toolbar {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: opacity .15s;
}
.btn:hover { opacity: .85; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }

.preview-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.preview-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.preview-card-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.mail-frame {
  padding: 24px;
  background: #fff;
}
.mail-chrome {
  background: #f0f0f0;
  padding: 10px 14px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.mail-dot { width: 10px; height: 10px; border-radius: 50%; }

.code-wrap { padding: 0; }
#code-area {
  width: 100%;
  min-height: 140px;
  font-size: 11.5px;
  font-family: 'Courier New', monospace;
  background: #1a1a1a;
  color: #e8e8e8;
  border: none;
  padding: 14px;
  resize: vertical;
  outline: none;
  line-height: 1.5;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a1a;
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .pane { border-right: none; border-bottom: 1px solid var(--border); height: auto; max-height: 55vh; }
  .hdr-sub { display: none; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-dot"></div>
  <div class="hdr-title">Générateur de signature e-mail — ENSEA</div>
  <div class="hdr-sub">IT / DSI</div>
</header>

<div class="layout">
  <aside class="pane">
    <h2>Identité</h2>
    <div class="row2">
      <div class="field">
        <label for="f-civ">Civilité</label>
        <select id="f-civ">
          <option value="">—</option>
          <option value="M.">M.</option>
          <option value="Mme">Mme</option>
        </select>
      </div>
      <div class="field">
        <label for="f-prenom">Prénom</label>
        <input type="text" id="f-prenom" placeholder="Marie">
      </div>
    </div>
    <div class="field">
      <label for="f-nom">Nom</label>
      <input type="text" id="f-nom" placeholder="DUPONT">
    </div>
    <div class="field">
      <label for="f-fn1">Fonction 1</label>
      <input type="text" id="f-fn1" placeholder="Maître de conférences">
    </div>
    <div class="field">
      <label for="f-fn2">Fonction 2 (optionnel)</label>
      <input type="text" id="f-fn2" placeholder="">
    </div>

    <h2>Coordonnées</h2>
    <div class="field">
      <label for="f-mail">E-mail</label>
      <input type="email" id="f-mail" placeholder="prenom.nom@ensea.fr">
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-tel1">Tél 1</label>
        <input type="text" id="f-tel1" placeholder="+33 1 30 73 66 00">
      </div>
      <div class="field">
        <label for="f-tel2">Tél 2 (optionnel)</label>
        <input type="text" id="f-tel2" placeholder="">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="f-bat">Bâtiment</label>
        <select id="f-bat">
          <option value="">—</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
      </div>
      <div class="field">
        <label for="f-bureau">Bureau</label>
        <input type="text" id="f-bureau" placeholder="215">
      </div>
    </div>
    <div class="field">
      <label for="f-tele">Télétravail (jours)</label>
      <input type="text" id="f-tele" placeholder="ex: lundi et mardi">
    </div>

    <h2>Options</h2>
    <div class="toggle-row">
      <input type="checkbox" id="opt-eco">
      <label for="opt-eco">Ajouter la phrase éco-responsable</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="opt-deco">
      <label for="opt-deco">Ajouter la phrase droit à la déconnexion</label>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="opt-transp">
      <label for="opt-transp">Fond transparent (au lieu de blanc)</label>
    </div>
  </aside>

  <main class="preview">
    <div class="preview-toolbar">
      <button class="btn btn-primary" onclick="copyRich()">📋 Copier (mise en forme)</button>
      <button class="btn btn-outline" onclick="copyHTML()">Copier le code HTML</button>
      <button class="btn btn-outline" onclick="downloadHTML()">Télécharger</button>
    </div>
    <div class="preview-area">
      <div class="preview-card">
        <div class="mail-chrome">
          <div class="mail-dot" style="background:#ff5f56"></div>
          <div class="mail-dot" style="background:#ffbd2e"></div>
          <div class="mail-dot" style="background:#27c93f"></div>
        </div>
        <div class="preview-card-label">Aperçu</div>
        <div class="mail-frame">
          <div id="sig-preview"></div>
        </div>
      </div>
      <div class="preview-card">
        <div class="preview-card-label">Code HTML</div>
        <div class="code-wrap">
          <textarea id="code-area" readonly spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

const ADDR = '6 avenue du Ponceau, 95014 Cergy-Pontoise Cedex';
const SITE  = 'https://www.ensea.fr';
const LS    = 'ensea_sig_v1';

// ── HELPERS ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const v = id => ($( id ).value || '').trim();
const chk = id => $( id ).checked;

function fields() {
  return {
    civ:    v('f-civ'),
    prenom: v('f-prenom'),
    nom:    v('f-nom'),
    fn1:    v('f-fn1'),
    fn2:    v('f-fn2'),
    mail:   v('f-mail'),
    tel1:   v('f-tel1'),
    tel2:   v('f-tel2'),
    bat:    v('f-bat'),
    bureau: v('f-bureau'),
    tele:   v('f-tele'),
    eco:    chk('opt-eco'),
    deco:   chk('opt-deco'),
    transp: chk('opt-transp'),
  };
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── SIGNATURE BUILDER ──────────────────────────────────────────────────────
function buildSig(f) {
  if (!f) f = fields();
  const bg = f.transp ? 'transparent' : '#ffffff';
  const vd = "Verdana, Geneva, Arial, sans-serif";
  const gray = '#555555';

  // Nom : Prénom NOM (nom en majuscules)
  const nomMaj = f.nom ? f.nom.toUpperCase() : '';
  const nameParts = [f.civ, f.prenom, nomMaj].filter(Boolean);
  const name = nameParts.map(esc).join(' ');

  // Ligne email • tél1 • tél2
  let contactParts = [];
  if (f.mail) contactParts.push('<a href="mailto:' + esc(f.mail) + '" style="color:' + gray + ';text-decoration:none;">' + esc(f.mail) + '</a>');
  if (f.tel1) contactParts.push('<a href="tel:' + esc(f.tel1.replace(/\s/g,'')) + '" style="color:' + gray + ';text-decoration:none;">' + esc(f.tel1) + '</a>');
  if (f.tel2) contactParts.push('<a href="tel:' + esc(f.tel2.replace(/\s/g,'')) + '" style="color:' + gray + ';text-decoration:none;">' + esc(f.tel2) + '</a>');
  const contactLine = contactParts.join(' • ');

  // Adresse : ENSEA • 6, avenue du Ponceau • 95000 Cergy [• Bât X – Bureau Y]
  let addrParts = ['ENSEA', '6, avenue du Ponceau', '95000 Cergy'];
  if (f.bat || f.bureau) {
    let bureau = '';
    if (f.bat && f.bureau) bureau = 'Bât. ' + esc(f.bat) + ' – Bureau ' + esc(f.bureau);
    else if (f.bat) bureau = 'Bât. ' + esc(f.bat);
    else bureau = 'Bureau ' + esc(f.bureau);
    addrParts.push(bureau);
  }
  const addrLine = addrParts.join(' • ');

  let sig = '<!-- Signature ENSEA -->\n';
  sig += '<table cellpadding="0" cellspacing="0" border="0" style="background:' + bg + ';font-family:' + vd + ';">\n';
  sig += '<tr>\n';
  sig += '  <td style="vertical-align:middle;padding:0 12px 0 0;">\n';
  sig += '    <img src="' + LOGO + '" alt="ENSEA Beyond Engineering" width="115" style="display:block;width:115px;height:auto;">\n';
  sig += '  </td>\n';
  sig += '  <td style="vertical-align:middle;padding:0 0 0 14px;border-left:1.5px solid #cccccc;">\n';
  // Nom + prénom
  if (name) sig += '    <div style="margin:0 0 1px;font-size:11px;font-weight:bold;color:#1a1a1a;font-family:' + vd + ';">' + name + '</div>\n';
  // Fonction 1
  if (f.fn1) sig += '    <div style="margin:0;font-size:10px;color:' + gray + ';font-family:' + vd + ';">' + esc(f.fn1) + '</div>\n';
  // Fonction 2
  if (f.fn2) sig += '    <div style="margin:0 0 3px;font-size:10px;color:' + gray + ';font-family:' + vd + ';">' + esc(f.fn2) + '</div>\n';
  // Séparateur vide si pas de fn2
  else if (f.fn1) sig += '    <div style="margin:0 0 3px;font-size:1px;">&nbsp;</div>\n';
  // Email • Tél
  if (contactLine) sig += '    <div style="margin:0;font-size:10px;color:' + gray + ';font-family:' + vd + ';">' + contactLine + '</div>\n';
  // Adresse
  sig += '    <div style="margin:0;font-size:10px;color:' + gray + ';font-family:' + vd + ';">' + addrLine + '</div>\n';
  // Site
  sig += '    <div style="margin:0;font-size:10px;font-family:' + vd + ';"><a href="' + SITE + '" style="font-size:10px;color:' + gray + ';text-decoration:none;font-family:' + vd + ';">' + SITE.replace('https://','') + '</a></div>\n';
  // Télétravail
  if (f.tele) sig += '    <div style="margin:2px 0 0;font-size:10px;color:' + gray + ';font-family:' + vd + ';">Télétravail : ' + esc(f.tele) + '</div>\n';
  sig += '  </td>\n';
  sig += '</tr>\n';
  sig += '</table>\n';

  if (f.eco) {
    sig += '<p style="margin:6px 0 0;font-size:9px;color:#888888;font-style:italic;font-family:' + vd + ';">Pour préserver nos ressources, pensez à limiter l\'impression de vos e-mails</div>\n';
  }
  if (f.deco) {
    sig += '<p style="margin:3px 0 0;font-size:9px;color:#888888;font-style:italic;font-family:' + vd + ';">Pour respecter le droit à la déconnexion, ce message n\'appelle pas de réponse en dehors de vos horaires habituels de travail.</div>\n';
  }

  return sig;
}

// ── UPDATE ─────────────────────────────────────────────────────────────────
function update() {
  try {
    var f = fields();
    var sig = buildSig(f);
    $('sig-preview').innerHTML = sig;
    $('code-area').value = sig;
    saveState();
  } catch(e) {
    console.error('update error', e);
  }
}

// ── COPY / DOWNLOAD ────────────────────────────────────────────────────────
async function copyRich() {
  var html = $('sig-preview').innerHTML;
  try {
    var blob = new Blob([html], {type:'text/html'});
    await navigator.clipboard.write([new ClipboardItem({'text/html': blob})]);
    showToast('Signature copiée avec mise en forme !');
    logToSheets();
  } catch(e) {
    copyHTML();
  }
}

function copyHTML() {
  var ta = $('code-area');
  ta.select();
  document.execCommand('copy');
  showToast('Code HTML copié !');
}

function downloadHTML() {
  var content = $('code-area').value;
  var blob = new Blob([content], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'signature-ensea.html';
  a.click();
}

// ── TOAST ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

// ── PERSISTANCE ────────────────────────────────────────────────────────────
function saveState() {
  try { localStorage.setItem(LS, JSON.stringify(fields())); } catch(e){}
}

function restoreState() {
  try {
    var data = JSON.parse(localStorage.getItem(LS) || '{}');
    var map = {civ:'f-civ',prenom:'f-prenom',nom:'f-nom',fn1:'f-fn1',fn2:'f-fn2',
               mail:'f-mail',tel1:'f-tel1',tel2:'f-tel2',bat:'f-bat',bureau:'f-bureau',tele:'f-tele'};
    for (var k in map) { if (data[k] !== undefined) $(map[k]).value = data[k]; }
    if (data.eco !== undefined) $('opt-eco').checked = data.eco;
    if (data.deco !== undefined) $('opt-deco').checked = data.deco;
    if (data.transp !== undefined) $('opt-transp').checked = data.transp;
  } catch(e){}
}

// ── URL PARAMS ─────────────────────────────────────────────────────────────
(function() {
  var p = new URLSearchParams(window.location.search);
  var map = {prenom:'f-prenom',nom:'f-nom',civ:'f-civ',fn1:'f-fn1',fn2:'f-fn2',
             mail:'f-mail',tel1:'f-tel1',tel2:'f-tel2',bat:'f-bat',bureau:'f-bureau',tele:'f-tele'};
  var hasParam = false;
  for (var k in map) {
    if (p.has(k)) { $(map[k]).value = p.get(k); hasParam = true; }
  }
  if (!hasParam) restoreState();
  update();
})();

// ── EVENT LISTENERS ────────────────────────────────────────────────────────
['f-civ','f-prenom','f-nom','f-fn1','f-fn2','f-mail','f-tel1','f-tel2','f-bat','f-bureau','f-tele'].forEach(function(id) {
  $(id).addEventListener('input', update);
  $(id).addEventListener('change', update);
});
['opt-eco','opt-deco','opt-transp'].forEach(function(id) {
  $(id).addEventListener('change', update);
});

// ── TRACKING CTRL+C ────────────────────────────────────────────────────────
// Logge dans Sheets à chaque copie (bouton OU Ctrl+C) — une seule fois par 5s
var _lastLog = 0;
function throttledLog() {
  var now = Date.now();
  if (now - _lastLog > 5000) {
    _lastLog = now;
    logToSheets();
  }
}
// Sur le textarea du code HTML
$('code-area').addEventListener('copy', throttledLog);
// Sur le preview (sélection manuelle + Ctrl+C)
$('sig-preview').addEventListener('copy', throttledLog);
// Fallback global : si quelqu'un fait Ctrl+C n'importe où sur la page
document.addEventListener('copy', throttledLog);
</script>
